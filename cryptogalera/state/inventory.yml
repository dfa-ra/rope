architecture:
  paragraph: >-
    Rope is a private self-hosted 1-to-1 E2EE messenger. The Android app
    provisions a personal VPS (or joins an existing one), then devices on that
    server exchange encrypted text. Kotlin owns UI, Room history, HTTPS/WSS,
    QR, and SSH provision UI; it calls UniFFI and never implements crypto or
    touches raw private keys. The Rust core (rope_core) holds device identity,
    keys, envelope encrypt/sign/verify, and invite + TLS-fingerprint checks.
    The Go relay authenticates devices, stores public identities and invite
    token hashes, and routes opaque mailbox blobs over REST and WSS; it never
    sees plaintext. Deployment is an idempotent installer plus systemd and
    self-signed TLS. Application protocol version is 1; this tree carries text
    envelopes only.
  components:
    - layer: Android UI
      location: apps/android
      responsibility: Screens, lifecycle, HTTPS/WSS, QR, SSH provisioning, local history
    - layer: Rust core
      location: core/rust
      responsibility: Device identity, keys, envelope, encrypt/sign/verify, invite + fingerprint checks, UniFFI
    - layer: Go relay
      location: server/go
      responsibility: REST + WSS, members/devices, invites, encrypted mailbox, health
    - layer: Deployment
      location: deployment/
      responsibility: Idempotent VPS install, systemd, TLS material
    - layer: Protocol
      location: protocol/docs
      responsibility: Wire format (envelope, REST, WSS, invite); version 1
    - layer: CryptoGalera runtime
      location: cryptogalera/
      responsibility: Company process wrapping Rope (not product code)

