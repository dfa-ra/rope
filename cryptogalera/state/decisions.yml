decisions:
  - id: D-001
    title: Documented product is main MVP
    date: "2026-09-08"
    status: superseded
    superseded_by: D-005
    decider: founder_po
    pointer: docs/decisions.md#d-001-documented-product-is-main-mvp
    summary: >-
      Until the user picked a trunk in D-005, the product contract was main +
      docs/product.md + README. Superseded by D-005 A.

  - id: D-002
    title: Client / core / relay stack
    date: "2026-09-08"
    status: accepted
    decider: engineering_confirmed_by_po
    pointer: docs/decisions.md#d-002-client--core--relay-stack
    summary: >-
      Android Kotlin UI; cryptography only in Rust via UniFFI (rope_core);
      Go relay with SQLite; no FCM — the personal VPS is the transport.
    already_shipped_on: main
    consequences:
      - iOS/web/desktop are new products, not ports of the Kotlin layer.
      - Kotlin must not touch raw private keys.

  - id: D-003
    title: Crypto primitives and no ratchet in v1
    date: "2026-09-08"
    status: accepted
    decider: engineering_and_po
    pointer: docs/decisions.md#d-003-crypto-primitives-and-no-ratchet-in-v1
    summary: >-
      Device keys Ed25519 (sign) + X25519 (ECDH). Envelope HKDF-SHA256,
      XChaCha20-Poly1305. No X3DH / Double Ratchet / MLS. Compromise of a
      device ECDH key exposes future messages to that device until keys are
      rotated (out of scope).
    matches: docs/threat-model.md
    consequences:
      - Do not add a ratchet because it is industry-standard; that is a user-visible threat-model change.

  - id: D-004
    title: Trust boundaries and transport
    date: "2026-09-08"
    status: accepted
    decider: engineering_and_po
    pointer: docs/decisions.md#d-004-trust-boundaries-and-transport
    summary: >-
      Server stores public identities, invite token hashes, and opaque mailbox
      blobs. Self-signed TLS plus client fingerprint pinning; invite URL binds
      server_id + fingerprint. Auth header Rope <device_id>.<unix_seconds>.<sig>.
      One organizer VPS; owner bootstrap via one-time setup_token.
    consequences:
      - Ignoring a fingerprint mismatch is a user action the product must not paper over.
      - Public CA is not required for MVP.
      - SSH credentials exist only for provisioning.

  - id: D-005
    title: Stage-2 parallel line (escalated)
    date: "2026-09-08"
    status: accepted
    chosen: A
    decider: user
    pointer: docs/decisions.md#d-005-stage-2-parallel-line-escalated
    summary: >-
      Promote shipped Stage-2. Merge tag v0.2.15 (9694e80) into main. Keep
      CryptoGalera wrap and existing GitHub Releases. Do not retag. Close
      nested PRs #2/#3 after contained. Keep unique telegram-chrome-872f.
    task: T-002

  - id: D-006
    title: Merge policy and agent freeze
    date: "2026-09-08"
    status: accepted
    decider: founder_po
    pointer: docs/decisions.md#d-006-merge-policy-and-agent-freeze
    summary: >-
      One task → one accountable owner → one branch. Nested supersets
      (PR #2 vs #3) are not two merge targets. New feature agents are frozen
      until D-005. Integration owner defaults to Engineering Lead. Reviewer ≠
      author for crypto, auth, protocol, architecture.
    task: T-003
    consequences:
      - Overlapping agents on the same paths are a process bug.
      - Release bumps are not a substitute for merging to main.

  - id: D-007
    title: CryptoGalera runtime wraps Rope; product is frozen
    date: "2026-09-08"
    status: accepted
    decider: founder_po
    pointer: docs/decisions.md#d-007-cryptogalera-runtime-wraps-rope-product-is-frozen
    prose_note: >-
      PO is editing D-007 in docs/decisions.md (may be uncommitted). State Lead
      does not edit docs/. Machine-readable decision is accepted as stated by PO.
    summary: >-
      Install CryptoGalera runtime at cryptogalera/ plus Cursor enforcement at
      .cursor/rules/cryptogalera.mdc. Do not implement, merge, or redesign Rope
      product code in this phase. Do not delete or reset existing work (including
      Stage-2 branches/PRs/tags and unverified session docs). Previous session
      markdown is adopted as unverified SoT, not treated as the runtime. Product
      trunk remains D-001 / D-005.
    mode: MIGRATION
    task: T-006
    consequences:
      - Agents in this repo first read cryptogalera/ state.
      - Mode is MIGRATION until the PO sets it otherwise.
      - Feature freeze (T-003) still holds.
      - Unfreeze is T-007 (user must say so; D-005 if implementation would change trunk).

  - id: D-008
    title: Cursor multi-agent runtime protocol
    date: "2026-09-08"
    status: accepted
    decider: founder_po
    pointer: docs/decisions.md#d-008-cursor-multi-agent-runtime-protocol
    summary: >-
      Persist protocol as cryptogalera/RUNTIME.md. PO-owned live memory in
      .cryptogalera/. Task IDs CG-XXX. Workers never spawn. Real Task-tool
