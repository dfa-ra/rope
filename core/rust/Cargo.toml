[package]
name = "rope_core"
version = "0.3.35"
edition = "2021"
license = "MIT"
description = "Rope security and protocol core"
repository = "https://github.com/dfa-ra/rope"

[lib]
name = "rope_core"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[bin]]
name = "rope-tool"
path = "src/bin/rope-tool.rs"

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "=0.28.3" }
thiserror = "=1.0.69"
rand = "=0.8.5"
uuid = { version = "=1.11.0", features = ["v4"] }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
sha2 = "=0.10.8"
hex = "=0.4.3"
base64 = "=0.22.1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
uniffi = { version = "=0.28.3", features = ["build"] }
