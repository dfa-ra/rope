name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build linux binaries
        working-directory: server/go
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/rope-server-linux-amd64 ./cmd/rope-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/rope-server-linux-arm64 ./cmd/rope-server
          cd dist
          sha256sum rope-server-linux-amd64 rope-server-linux-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rope-server
          path: server/go/dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - name: cargo-ndk
        run: cargo install cargo-ndk
      - name: Native libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-android-native.sh
      - name: Assemble APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/rope.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=/tmp/rope.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "rope-${VERSION}.apk"
          else
            echo "Signing secrets missing; publishing debug APK"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "rope-${VERSION}-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rope-android
          path: apps/android/rope-*.apk

  publish:
    needs: [server, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Checksums
        run: |
          sha256sum rope-server/* rope-android/* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: |
            rope-server/*
            rope-android/*
            SHA256SUMS
          body: |
            Rope MVP release artifacts.

            - `rope-server-linux-amd64` / `rope-server-linux-arm64` — скачивается телефоном при «Создать сервер»
            - Android APK (debug, пока нет secrets `ANDROID_KEYSTORE_*`)

            Установка с телефона: Create server → SSH → приложение само ставит systemd-юнит.
            Обновление ядра: Server → Update server core (SSH ещё раз, data.db сохраняется).
