name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go test ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # v3's cmdline-tools 16.0 fails on current ubuntu-latest with
      # "Error on ZipFile unknown archive" while unpacking the emulator
      # pulled in by the default `tools` package. Unit tests do not need it.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew test --stacktrace
